name: Windows framework
on:
  workflow_dispatch:
  push:
    paths: ['examples/environment/**', 'src/nimi/core/environment.nim', 'src/nimi/platform/**', 'tests/test_platform_contract.nim', 'tests/test_menu_callbacks.nim', 'tests/test_environment*.nim', 'tests/test_windows*.nim', 'tests/windows_input_fixture.c', 'src/nimi/core/app.nim', 'src/nimi/core/content.nim', 'src/nimi/core/window.nim', 'src/nimi/render/gdi.nim', 'src/nimi/text/**', 'src/nimi/ui/**', 'src/nimi/keys.nim', '.github/workflows/windows.yml']
  pull_request:
    paths: ['examples/environment/**', 'src/nimi/core/environment.nim', 'src/nimi/platform/**', 'tests/test_platform_contract.nim', 'tests/test_menu_callbacks.nim', 'tests/test_environment*.nim', 'tests/test_windows*.nim', 'tests/windows_input_fixture.c', 'src/nimi/core/app.nim', 'src/nimi/core/content.nim', 'src/nimi/core/window.nim', 'src/nimi/render/gdi.nim', 'src/nimi/text/**', 'src/nimi/ui/**', 'src/nimi/keys.nim', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  environment:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jiro4989/setup-nim-action@v2.3.1
        with:
          nim-version: '2.4.0'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Debug toolchain
        run: |
          Write-Output "PATH: $env:PATH"
          Get-Command nim | Format-List
          Get-Command gcc -ErrorAction SilentlyContinue | Format-List
          Get-Command cl -ErrorAction SilentlyContinue | Format-List
          nim --version
          Set-Content hello.nim 'echo "hello"'
          nim c -r --hints:off hello.nim
          Write-Output "smoke exit: $LASTEXITCODE"
      - name: Debug input test
        run: |
          Set-Content mini_graphics.nim 'import nimi/platform/windows/graphics'
          nim check --hints:off mini_graphics.nim *> check_graphics.log
          Write-Output "check graphics exit: $LASTEXITCODE"
          Get-Content check_graphics.log -Tail 80
          nim c --compileOnly --hints:off --verbosity:3 mini_graphics.nim *> compile_graphics.log
          Write-Output "compile graphics exit: $LASTEXITCODE"
          Get-Content compile_graphics.log -Tail 120
          nim c --hints:off --verbosity:3 --listCmd mini_graphics.nim *> build_graphics.log
          Write-Output "build graphics exit: $LASTEXITCODE"
          Get-Content build_graphics.log -Tail 120
      - run: nim c -r --hints:off tests/test_windows_input.nim
      - run: nim c -r --hints:off tests/test_windows_input_native.nim
      - run: nim c -r --hints:off tests/test_windows_menu_plan.nim
      - run: nim c -r --hints:off tests/test_menu_callbacks.nim
      - run: nim c -r --hints:off tests/test_windows_menu.nim
      - run: nim c -r --hints:off tests/test_platform_contract.nim
      - run: nim c -r --hints:off tests/test_cli_windows.nim
      - run: nim c --hints:off -o:nimi.exe src/nimi/cli.nim
      - run: .\nimi.exe version
      - run: .\nimi.exe build examples/hello
      - run: nim c -r --hints:off tests/test_environment.nim
      - run: nim c -r --hints:off tests/test_environment_windows.nim
      - run: nim c -r --hints:off tests/test_windows_host.nim
      - run: nim c -r --hints:off tests/test_windows_surface.nim
      - run: nim c -r --hints:off tests/test_windows_webview.nim
      - run: nim c -r --hints:off tests/test_windows_webview_protocol.nim
      - run: nim c -r --hints:off tests/test_windows_desktop.nim
      - run: nim c -r --hints:off tests/test_windows_animation.nim
      - run: nim c -r --hints:off tests/test_windows_render.nim
      - run: nim c -r --hints:off tests/test_environment_editor.nim
      - run: nim c -r --hints:off tests/test_environment_ui.nim
      - run: nim c -r --hints:off tests/test_environment_app_windows.nim
      - run: nim c --passL:-Wl,--subsystem,windows --hints:off -o:NimiEnvironment.exe examples/environment/main.nim
