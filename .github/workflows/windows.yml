name: Windows framework
on:
  workflow_dispatch:
  push:
    paths: ['examples/environment/**', 'src/nimi/core/environment.nim', 'src/nimi/platform/**', 'tests/test_platform_contract.nim', 'tests/test_menu_callbacks.nim', 'tests/test_environment*.nim', 'tests/test_windows*.nim', 'tests/windows_input_fixture.c', 'src/nimi/core/app.nim', 'src/nimi/core/content.nim', 'src/nimi/core/window.nim', 'src/nimi/render/gdi.nim', 'src/nimi/text/**', 'src/nimi/ui/**', 'src/nimi/keys.nim', '.github/workflows/windows.yml']
  pull_request:
    paths: ['examples/environment/**', 'src/nimi/core/environment.nim', 'src/nimi/platform/**', 'tests/test_platform_contract.nim', 'tests/test_menu_callbacks.nim', 'tests/test_environment*.nim', 'tests/test_windows*.nim', 'tests/windows_input_fixture.c', 'src/nimi/core/app.nim', 'src/nimi/core/content.nim', 'src/nimi/core/window.nim', 'src/nimi/render/gdi.nim', 'src/nimi/text/**', 'src/nimi/ui/**', 'src/nimi/keys.nim', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  environment:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jiro4989/setup-nim-action@v2.3.1
        with:
          nim-version: '2.4.0'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enlarge the Nim compiler stack
        run: |
          # Nim 2.4.0's Windows compiler ships with a 2 MiB stack, which
          # overflows while checking ui/context.nim. Patch the PE32+
          # SizeOfStackReserve field directly so CI does not depend on
          # Visual Studio's editbin.
          $path = "$env:GITHUB_WORKSPACE\.nim_runtime\bin\nim.exe"
          $bytes = [System.IO.File]::ReadAllBytes($path)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $magic = [BitConverter]::ToUInt16($bytes, $pe + 24)
          if ($magic -ne 0x20B) { throw "nim.exe is not PE32+" }
          $offset = $pe + 96
          Write-Output "old stack reserve: $([BitConverter]::ToUInt64($bytes, $offset))"
          [BitConverter]::GetBytes([UInt64]8388608).CopyTo($bytes, $offset)
          [System.IO.File]::WriteAllBytes($path, $bytes)
          Write-Output "new stack reserve: $([BitConverter]::ToUInt64([System.IO.File]::ReadAllBytes($path), $offset))"
      - name: Verify the compiler stack
        run: |
          Set-Content mini_context.nim 'import nimi/ui/context'
          nim check --hints:off mini_context.nim
      - name: Run Windows tests
        run: |
          $tests = @(
            "test_windows_input",
            "test_windows_input_native",
            "test_windows_menu_plan",
            "test_menu_callbacks",
            "test_windows_menu",
            "test_platform_contract",
            "test_cli_windows",
            "test_environment",
            "test_environment_windows",
            "test_windows_host",
            "test_windows_surface",
            "test_windows_webview",
            "test_windows_webview_protocol",
            "test_windows_desktop",
            "test_windows_animation",
            "test_windows_render",
            "test_environment_editor",
            "test_environment_ui",
            "test_environment_app_windows"
          )
          $failed = @()
          foreach ($test in $tests) {
            Write-Output "=== $test ==="
            nim c -r --hints:off "tests/$test.nim"
            if ($LASTEXITCODE -ne 0) { $failed += $test }
          }
          if ($failed.Count -gt 0) {
            Write-Output "FAILED TESTS: $($failed -join ', ')"
            exit 1
          }
      - name: Build CLI and demo
        run: |
          $failed = @()
          nim c --hints:off -o:nimi.exe src/nimi/cli.nim
          if ($LASTEXITCODE -ne 0) { $failed += "cli" }
          if (Test-Path .\nimi.exe) {
            .\nimi.exe version
            if ($LASTEXITCODE -ne 0) { $failed += "nimi version" }
            .\nimi.exe build examples/hello
            if ($LASTEXITCODE -ne 0) { $failed += "nimi build examples/hello" }
          }
          nim c --passL:-Wl,--subsystem,windows --hints:off -o:NimiEnvironment.exe examples/environment/main.nim
          if ($LASTEXITCODE -ne 0) { $failed += "environment gui" }
          if ($failed.Count -gt 0) {
            Write-Output "FAILED BUILDS: $($failed -join ', ')"
            exit 1
          }
